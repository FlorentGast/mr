<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle : pronoms et verbes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef3f9; --card:#ffffff; --ink:#172a4a; --muted:#5b6b86; --line:#c9d6e8;
  --sel:#2f6fed; --sel-bg:#e3ecff; --ok:#1a8a5f; --ok-bg:#dff5ea; --err:#d64545;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1726; --card:#1a2640; --ink:#e8eefb; --muted:#9fb0cf; --line:#2d3d5f;
    --sel:#7aa5ff; --sel-bg:#22345e; --ok:#4cc794; --ok-bg:#16382f; --err:#ff7b7b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1726; --card:#1a2640; --ink:#e8eefb; --muted:#9fb0cf; --line:#2d3d5f;
  --sel:#7aa5ff; --sel-bg:#22345e; --ok:#4cc794; --ok-bg:#16382f; --err:#ff7b7b;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.4; min-height:100vh;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);
  background-attachment:local;
}
main{max-width:560px;margin:0 auto;padding:18px 14px 32px}
h1{font-size:1.45rem;margin:0 0 4px;line-height:1.2}
.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.tab{
  flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;min-height:44px
}
.tab[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg)}
.tab.done::after{content:" ✓";color:var(--ok)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-weight:700}
.bar span{color:var(--muted);font-weight:400}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.col{display:flex;flex-direction:column;gap:10px}
.cell{
  min-height:58px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:8px 10px;font:inherit;font-size:1.05rem;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.cell small{font-weight:400;font-size:.78rem;color:var(--muted)}
.cell.left{background:var(--sel-bg);border-color:transparent}
.cell.sel{border-color:var(--sel);background:var(--card);box-shadow:0 0 0 3px var(--sel-bg)}
.cell.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.cell.used{visibility:hidden}
.cell.bad{animation:shake .35s;border-color:var(--err)}
.cell:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.cell.bad{animation:none}}
.win{margin-top:16px;padding:14px;border-radius:12px;background:var(--ok-bg);border:2px solid var(--ok);text-align:center}
.win p{margin:0 0 10px;font-weight:700}
.btn{
  border:0;background:var(--sel);color:#fff;font:inherit;font-weight:700;border-radius:10px;
  padding:11px 18px;min-height:44px;cursor:pointer
}
:root[data-theme="dark"] .btn,
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0f1726} }
.btn.ghost{background:transparent;color:var(--sel);border:2px solid var(--sel)}
.actions{display:flex;justify-content:center;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Pronoms et verbes</h1>
  <p class="sub">Touchez un pronom, puis la forme du verbe qui va avec. Présent de l’indicatif.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Choisir un verbe"></div>
  <div class="bar"><div id="score">0 / 6</div><span id="errs">0 erreur</span></div>
  <div class="board" id="board"></div>
  <div class="win" id="win" hidden>
    <p id="winmsg"></p>
    <button class="btn" id="again" type="button">Rejouer</button>
  </div>
  <div class="actions"><button class="btn ghost" id="reset" type="button">Mélanger de nouveau</button></div>
</main>
<script>
(function(){
  var P = ["je","tu","il / elle / on","nous","vous","ils / elles"];
  var V = {
    "S’APPELER":[["m’appelle","je m’appelle"],["t’appelles","tu t’appelles"],["s’appelle","il / elle / on s’appelle"],["nous appelons","nous nous appelons"],["vous appelez","vous vous appelez"],["s’appellent","ils / elles s’appellent"]],
    "ÊTRE":[["suis","je suis"],["es","tu es"],["est","il / elle / on est"],["sommes","nous sommes"],["êtes","vous êtes"],["sont","ils / elles sont"]],
    "AVOIR":[["ai","j’ai"],["as","tu as"],["a","il / elle / on a"],["avons","nous avons"],["avez","vous avez"],["ont","ils / elles ont"]],
    "CHOISIR":[["choisis","je choisis"],["choisis","tu choisis"],["choisit","il / elle / on choisit"],["choisissons","nous choisissons"],["choisissez","vous choisissez"],["choisissent","ils / elles choisissent"]],
    "AIMER":[["aime","j’aime"],["aimes","tu aimes"],["aime","il / elle / on aime"],["aimons","nous aimons"],["aimez","vous aimez"],["aiment","ils / elles aiment"]],
    "ALLER":[["vais","je vais"],["vas","tu vas"],["va","il / elle / on va"],["allons","nous allons"],["allez","vous allez"],["vont","ils / elles vont"]]
  };
  var NAMES = Object.keys(V);
  var MIX = "Mélange";
  var mode = NAMES[0], done = {}, rows = [], cards = [], sel = null, matched = 0, errors = 0;

  var $ = function(id){return document.getElementById(id)};
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

  function build(){
    sel=null;matched=0;errors=0;
    if(mode===MIX){
      var combos=[];
      NAMES.forEach(function(n){for(var i=0;i<6;i++)combos.push({v:n,p:i})});
      var pick=[],usedP={};
      shuffle(combos).forEach(function(c){
        if(pick.length<6 && !usedP[c.v+c.p]){
          var key=V[c.v][c.p][0];
          if(!pick.some(function(x){return V[x.v][x.p][0]===key})) pick.push(c);
        }
      });
      rows=pick.map(function(c,i){return {id:i,pron:P[c.p],verb:c.v,key:V[c.v][c.p][0],full:V[c.v][c.p][1],ok:false}});
    }else{
      rows=P.map(function(p,i){return {id:i,pron:p,verb:null,key:V[mode][i][0],full:V[mode][i][1],ok:false}});
    }
    cards=shuffle(rows.map(function(r){return {id:r.id,txt:r.key,ok:false}}));
    // éviter que l'ordre soit déjà celui des pronoms
    if(cards.every(function(c,i){return c.id===i})) cards.reverse();
    render();
  }

  function render(){
    var L="",R="";
    rows.forEach(function(r){
      var cls="cell left"+(r.ok?" ok":"")+(sel&&sel.side==="L"&&sel.id===r.id?" sel":"");
      var txt=r.ok?esc(r.full):esc(r.pron);
      var sm=(!r.ok&&r.verb)?"<small>"+esc(r.verb.toLowerCase())+"</small>":"";
      L+='<button type="button" class="'+cls+'" data-s="L" data-i="'+r.id+'"'+(r.ok?" disabled":"")+'>'+txt+sm+'</button>';
    });
    cards.forEach(function(c,k){
      var cls="cell"+(c.ok?" used":"")+(sel&&sel.side==="R"&&sel.k===k?" sel":"");
      R+='<button type="button" class="'+cls+'" data-s="R" data-k="'+k+'"'+(c.ok?" disabled aria-hidden=\"true\" tabindex=\"-1\"":"")+'>'+esc(c.txt)+'</button>';
    });
    $("board").innerHTML='<div class="col">'+L+'</div><div class="col">'+R+'</div>';
    $("score").textContent=matched+" / 6";
    $("errs").textContent=errors+(errors>1?" erreurs":" erreur");
    var t="";
    NAMES.concat([MIX]).forEach(function(n){
      t+='<button type="button" class="tab'+(done[n]?" done":"")+'" data-m="'+n+'" aria-pressed="'+(n===mode)+'">'+(n===MIX?MIX:n)+'</button>';
    });
    $("tabs").innerHTML=t;
    var w=$("win");
    if(matched===6){
      done[mode]=true;
      w.hidden=false;
      $("winmsg").textContent=errors===0?"Bravo ! Aucune erreur.":"Bravo ! Terminé avec "+errors+(errors>1?" erreurs.":" erreur.");
      // mettre à jour la coche
      var tb=document.querySelector('.tab[data-m="'+mode+'"]'); if(tb) tb.classList.add("done");
    }else w.hidden=true;
  }

  function flashBad(el){el.classList.add("bad");setTimeout(function(){el.classList.remove("bad")},380)}

  function attempt(rowId,k){
    var r=rows[rowId],c=cards[k];
    if(c.txt===r.key){
      r.ok=true;c.ok=true;matched++;sel=null;render();
    }else{
      errors++;sel=null;render();
      var a=document.querySelector('[data-s="L"][data-i="'+rowId+'"]');
      var b=document.querySelector('[data-s="R"][data-k="'+k+'"]');
      if(a)flashBad(a); if(b)flashBad(b);
    }
  }

  $("board").addEventListener("click",function(e){
    var b=e.target.closest(".cell"); if(!b||b.disabled)return;
    var side=b.getAttribute("data-s");
    var id=side==="L"?+b.getAttribute("data-i"):null;
    var k=side==="R"?+b.getAttribute("data-k"):null;
    if(sel&&sel.side===side){
      // même colonne : on change de sélection (ou on désélectionne)
      var same=(side==="L"&&sel.id===id)||(side==="R"&&sel.k===k);
      sel=same?null:(side==="L"?{side:"L",id:id}:{side:"R",k:k});
      render();return;
    }
    if(!sel){
      sel=side==="L"?{side:"L",id:id}:{side:"R",k:k};
      render();return;
    }
    if(side==="L")attempt(id,sel.k); else attempt(sel.id,k);
  });
  $("tabs").addEventListener("click",function(e){
    var t=e.target.closest(".tab"); if(!t)return;
    mode=t.getAttribute("data-m");build();
  });
  $("again").addEventListener("click",build);
  $("reset").addEventListener("click",build);
  build();
})();
</script>
</body>
</html>
